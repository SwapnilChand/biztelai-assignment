[project]
name = "shopfloor-copilot"
version = "0.1.0"
description = "Shop floor SOP copilot: FastAPI + RAG over plant PDFs, answers with sources, revision aware"
authors = [
    { name = "Swapnil Chand", email = "swapnilchand51@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pypdf>=7.0.0",
    "qrcode>=8.2",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shopfloor-copilot = "shopfloor_copilot:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
